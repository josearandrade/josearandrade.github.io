<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal InfoBio Jr. - Josearandrade</title>
    <link rel="icon" href="../assets/images/foto.avif" type="image/avif">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: "#0a0a0a",
                        light: "#fcfbf7",
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-light dark:bg-dark text-dark dark:text-white min-h-screen flex flex-col font-['Inter'] transition-colors duration-300">
    <div class="absolute top-8 right-8 z-10">
        <button id="themeToggle" type="button" aria-label="Toggle color theme" class="p-2 rounded-lg bg-dark dark:bg-light text-light dark:text-dark w-10 h-10 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </div>
    <main class="flex-grow flex flex-col">
        <!-- Blog Post Header -->
        <section class="py-16 bg-gray-100 dark:bg-gray-900">
            <div class="max-w-3xl mx-auto px-4 text-center">
                <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tighter leading-tight text-shadow-glow-subtle">Portal InfoBio Jr.</h1>
                <p class="text-lg text-gray-600 dark:text-gray-300 mb-2">by José Augusto R. de Andrade</p>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Published on Feb 10, 2025</p>
                <div class="flex justify-center space-x-4 mb-4">
                    <a href="../index.html" class="button button-outlined flex items-center space-x-2">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        <span>Back to Home</span>
                    </a>
                </div>
            </div>
        </section>
        <!-- Blog Post Content -->
        <article class="max-w-3xl mx-auto px-4 py-12 prose prose-lg dark:prose-invert">
            <h1 class="text-4xl pb-8">About</h1>
            <p>
                Portal made for the InfobioJr company, a junior company in the field of biotechnology. Hosted by São Paulo University (USP).
                <a href="https://infobiojr.com.br" target="_blank" rel="noopener noreferrer" class="text-xl">Visit the site</a>.
            </p>
            <img src="../assets/images/infobiojr_portal.png" alt="Portal InfoBio Jr. Screenshot" class="w-full rounded-lg shadow-lg mt-6 mb-8">

        </article>
    </main>
    <footer class="w-full py-4 border-t border-gray-300 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
        &copy; 2024 José Augusto R. de Andrade
    </footer>
    <script src="../script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
